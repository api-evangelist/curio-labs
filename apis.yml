name: Curio Labs
description: 'Curio (curio.io), operated by Curio Labs, was a London-based audio-journalism
  subscription app founded in 2016 by Govind Balakrishnan and Srikant Chakravarti. It
  turned articles from premium publishers into professionally narrated audio and later
  added AI-generated personalized episodes. Backed by 500 Global (formerly 500 Startups),
  EarlyBird, Draper Esprit, Cherry Ventures and Horizons Ventures, it raised over $15M
  before the founders wound the company down after eight years, citing AI and big-tech
  competition; they have since moved on to a new venture (Gibran). Enrichment probe finds
  no public API, developer portal, documentation, SDKs, or OpenAPI surface — curio.io now
  serves a closure/landing page only.'
